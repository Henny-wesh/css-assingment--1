<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CSS Assignment</title>
 <style>
  
  body {
    background-color: #f2f6ff;
    font-family: 'Segoe UI', Arial, sans-serif;
    margin: 0;
    padding: 20px;
  }

  .container {
    max-width: 700px;
    margin: auto;
    background-color: white;
    padding: 20px;
    /* CSS borders */
    border: 3px solid #2c5aa0;
    border-radius: 12px;
  }

  
  h1 {
    color: #2c5aa0; /* CSS colors */
    font-family: Georgia, serif; /* CSS font-family */
    text-align: center;
  }

  p {
    color: #333333;
    font-size: 18px; /* CSS fonts */
    line-height: 1.8; /* CSS line-height */
    font-family: Verdana, sans-serif;
  }

  .highlight {
    color: darkgreen;
    background-color: #e8f5e9;
    border-left: 5px solid green;
    padding: 10px;
  }

  #main-text {
    font-weight: bold;
  }

  
  .my-image {
    width: 100%;
    max-width: 350px;
    height: auto;
    border: 4px solid #2c5aa0;
    border-radius: 10px;
    display: block;
    margin: 15px auto;
  }

  
  .my-form {
    background-color: #fafafa;
    padding: 15px;
    border: 2px solid #ccc;
    border-radius: 8px;
    margin-top: 20px;
  }

  .my-form label {
    display: block;
    margin-bottom: 5px;
    color: #2c5aa0;
    font-weight: bold;
  }

  .my-form input {
    width: 95%;
    padding: 10px;
    margin-bottom: 15px;
    border: 1px solid #aaa;
    border-radius: 5px;
    font-size: 16px;
  }

  /* format the form button */
  .my-btn {
    background-color: #2c5aa0;
    color: white;
    padding: 12px 25px;
    border: none;
    border-radius: 6px;
    cursor: pointer;
    font-size: 16px;
  }

  .my-btn:hover {
    background-color: #1a3a70;
  }
</style>
</head>
<body>

<div class="container">
  <h1>Enjoy learning CSS with me</h1>

  <p id="main-text" class="highlight">
    This snippet uses element, class and ID selectors. It shows CSS colors, fonts, line-height, and borders.
  </p>

  <p>
    CSS makes the website beautiful. You can control colors, background, fonts, spacing and borders all in one place.
  </p>

  <img src="c:\Users\USER\Downloads\html pic.jpg" alt="Sample Image" class="my-image">
  <p>want to learn more,register with us</p>

  <form class="my-form">
    <label for="name">Full Name</label>
    <input type="text" id="name" placeholder="Enter your name">

    <label for="email">Email</label>
    <input type="email" id="email" placeholder="Enter your email">

    <button type="submit" class="my-btn">Submit</button>
  </form>
</div>

</body>
</html>
